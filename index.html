<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransferWire - Application Bancaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container" id="app-root"></div>

<!-- MODAL DE RÉSULTAT (Succès / Échec) -->
<div class="overlay" id="result-modal">
    <div class="modal">
        <div class="modal-header" id="modal-header">
            <button class="close-btn" onclick="closeResultModal()">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <div class="check-icon-circle" id="modal-icon-circle">
                <svg viewBox="0 0 24 24" id="modal-icon-svg"></svg>
            </div>
        </div>
        <div class="modal-body">
            <div class="modal-title" id="modal-title"></div>
            <div class="transaction-details" id="modal-details"></div>
            <div class="info-text">
                <svg viewBox="0 0 24 24" id="modal-info-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span id="modal-message"></span>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-close" id="modal-close-btn" onclick="closeResultModal()"></button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
